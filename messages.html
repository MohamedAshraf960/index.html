<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>MyCare - Messages</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2 class="title">Patient Messages</h2>
        
        <div class="input-group">
            <label>Select Patient</label>
            <input type="text" placeholder="Search for patient name...">
        </div>

        <div class="input-group">
            <label>Your Message</label>
            <textarea style="width: 100%; border-radius: 10px; padding: 10px; border: 1px solid #ddd;" rows="5" placeholder="Write your response here..."></textarea>
        </div>

        <button class="button" onclick="alert('Message Sent!')">Send Now</button>
        
        <br><br>
        <a href="admin-dashboard.html" style="color: #666; text-decoration: none; font-size: 14px;">Back to Dashboard</a>
    </div>
</body>
</html>
