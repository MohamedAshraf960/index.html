<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <title>MyCare - Create Account</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <div class="file"><div class="heart"></div></div>
            <div class="brand-name">my<span>care</span></div>
        </div>

        <h2 class="title">Login Credentials</h2>

        <div class="input-group">
            <label>Username</label>
            <input type="text" placeholder="Choose a username">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Create a strong password">
        </div>

        <div class="input-group">
            <label>Confirm Password</label>
            <input type="password" placeholder="Re-type password">
        </div>

        <a href="admin-dashboard.html" class="button" style="text-decoration: none; display: block; text-align: center;">Confirm Account</a>
        
        <br>
        <a href="admin-new.html" style="color: #666; text-decoration: none; font-size: 14px;">Back</a>
    </div>
</body>
</html>
