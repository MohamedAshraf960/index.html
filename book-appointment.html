<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyCare - Book Appointment</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="file"><div class="heart"></div></div>
      <div class="brand-name">my<span>care</span></div>
    </div>

    <h2 class="title">Book Medical Appointment</h2>

    <div class="input-group">
      <label>Full Patient Name</label>
      <input type="text" placeholder="Enter your full name">
    </div>

    <div class="input-group">
      <label>Required Specialty</label>
      <select style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #e5e7eb; background: white; font-family: inherit;">
        <option>General Medicine</option>
        <option>Dentistry</option>
        <option>Internal Medicine</option>
        <option>Pediatrics</option>
      </select>
    </div>

    <div class="input-group">
      <label>Appointment Date</label>
      <input type="date">
    </div>

    <div class="input-group">
      <label>Appointment Time</label>
      <input type="time">
    </div>

    <button class="button" onclick="alert('Booking request sent successfully! The admin will contact you soon.')">Confirm Booking</button>
    
    <br>
    <a href="patient-options.html" style="color: #666; text-decoration: none; font-size: 14px;">← Back</a>
  </div>
</body>
</html>
